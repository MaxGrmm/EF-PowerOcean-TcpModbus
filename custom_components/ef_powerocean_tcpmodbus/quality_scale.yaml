# Self-assessment against Home Assistant's integration quality scale:
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# hassfest validates this file for core integrations only; it is kept here as
# the record of what each rule needs from a change.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no automation conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: >-
      The integration provides no automation triggers. Its events are documented
      with the features that fire them.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Modbus TCP needs no credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: >-
      The inverter announces no service over zeroconf or SSDP, and no DHCP
      hostname or MAC prefix is known to identify it, so it is added by address.
  discovery-update-info:
    status: exempt
    comment: There is no discovery to update the address from.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each entry is one inverter, whose device exists from setup.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Each entry is one inverter; its device goes with the entry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The dependency speaks Modbus TCP, not HTTP, so it takes no web session.
  strict-typing: done
