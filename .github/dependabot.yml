version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Both track a branch, not releases, and run an image that is pulled
      # fresh on every run. Bump their pins by hand if the wrapper changes.
      - dependency-name: hacs/action
      - dependency-name: home-assistant/actions
