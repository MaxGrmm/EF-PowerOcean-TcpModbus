name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 6 * * 1" # Weekly, to catch new Home Assistant releases
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.PRE_COMMIT_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -r requirements-development.txt
      - name: Apply pre-commit fixes
        run: pre-commit run --all-files --show-diff-on-failure
        continue-on-error: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Commit pre-commit fixes
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: apply automatic formatting"
      - name: Verify pre-commit checks
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: Unit tests (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: tested
            python: "3.14"
            requirement: "-r requirements-test.txt"
          # The oldest release hacs.json allows; below this, our tests fail
          - ha: "2025.12.0"
            python: "3.13"
            requirement: "pytest-homeassistant-custom-component==0.13.298 'pycares<5'"
          # Newest Home Assistant, unpinned; an early warning for coming releases
          - ha: latest
            python: "3.14"
            requirement: "pytest-homeassistant-custom-component"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install ${{ matrix.requirement }}
      - name: Install our requirements the way Home Assistant does
        run: |
          python .github/scripts/ha_requirements.py
          python -m pip install $(python .github/scripts/ha_requirements.py) \
            --constraint "$(python .github/scripts/ha_requirements.py --constraints)"
          python -m pip check
      - name: Run unit tests
        run: python -m pytest

  # Newest Home Assistant beta, forced over the harness, about a week before each
  # release; the same as latest when no beta is out. Scheduled runs only.
  unit-tests-beta:
    name: Unit tests (Home Assistant beta)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the newest Home Assistant beta
        run: |
          python -m pip install pytest-homeassistant-custom-component uv
          VERSION=$(python .github/scripts/ha_newest_version.py)
          echo "Home Assistant $VERSION"
          echo "homeassistant==$VERSION" > "$RUNNER_TEMP/overrides.txt"
          uv pip install --python "$(which python)" --prerelease=allow \
            --override "$RUNNER_TEMP/overrides.txt" pytest-homeassistant-custom-component
      - name: Install our requirements the way Home Assistant does
        run: |
          python .github/scripts/ha_requirements.py
          python -m pip install $(python .github/scripts/ha_requirements.py) \
            --constraint "$(python .github/scripts/ha_requirements.py --constraints)"
          # The harness pins an older Home Assistant than the beta we forced; that
          # mismatch is the point. Fail on any other incompatibility.
          PROBLEMS=$(python -m pip check | grep -v \
            -e "^pytest-homeassistant-custom-component " \
            -e "^No broken requirements found" || true)
          if [ -n "$PROBLEMS" ]; then echo "$PROBLEMS"; exit 1; fi
      - name: Run unit tests
        run: python -m pytest

  validate-hacs:
    name: Validate HACS
    if: github.repository == 'MaxGrmm/EF-PowerOcean-TcpModbus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master
