name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.PRE_COMMIT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -r requirements-development.txt
      - name: Apply pre-commit fixes
        run: pre-commit run --all-files --show-diff-on-failure
        continue-on-error: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Commit pre-commit fixes
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply automatic formatting"
      - name: Verify pre-commit checks
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: Unit tests (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: tested
            python: "3.14"
            requirement: "-r requirements-test.txt"
          # The oldest release hacs.json allows; below this, our tests fail
          - ha: "2025.12.0"
            python: "3.13"
            requirement: "pytest-homeassistant-custom-component==0.13.298 'pymodbus>=3.9,<4' 'pycares<5'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install ${{ matrix.requirement }}
      - name: Run unit tests
        run: python -m pytest

  validate-hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master
