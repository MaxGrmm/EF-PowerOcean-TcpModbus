name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/ef_powerocean_tcpmodbus/manifest.json
  # Runs from main with this repository's token, so a label also makes a beta of a
  # pull request from a fork. Nothing from the pull request is ever run: see beta.
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      version:
        description: Pre-release version without the v prefix, with a suffix such as 2.9.0-beta.1
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Create GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract release notes
        id: notes
        run: node scripts/release.mjs publish

      - name: Package integration
        if: steps.notes.outputs.tag != ''
        working-directory: custom_components/ef_powerocean_tcpmodbus
        run: zip -r "$RUNNER_TEMP/ef_powerocean_tcpmodbus.zip" . -x "__pycache__/*" "*/__pycache__/*"

      - name: Create GitHub release
        if: steps.notes.outputs.tag != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ runner.temp }}/ef_powerocean_tcpmodbus.zip
          generate_release_notes: true
          prerelease: ${{ steps.notes.outputs.prerelease }}

  prerelease:
    name: Create GitHub pre-release
    # Manual runs can only make pre-releases; real releases come from Prepare Release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare pre-release
        id: notes
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release.mjs prerelease "$VERSION"

      - name: Package integration
        working-directory: custom_components/ef_powerocean_tcpmodbus
        run: zip -r "$RUNNER_TEMP/ef_powerocean_tcpmodbus.zip" . -x "__pycache__/*" "*/__pycache__/*"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ runner.temp }}/ef_powerocean_tcpmodbus.zip
          generate_release_notes: true
          prerelease: true

  beta:
    name: Create beta from pull request
    # Adding a "beta: patch|minor|major" label publishes the PR head as the next beta.
    # The label is removed afterwards, so adding it again makes another beta. Only
    # someone who can label pull requests can start it, forks included.
    if: >-
      github.event_name == 'pull_request_target' &&
      startsWith(github.event.label.name, 'beta: ')
    runs-on: ubuntu-latest
    concurrency:
      group: beta-release
      cancel-in-progress: false
    steps:
      # main: the release script that runs comes from here, never from the PR. No
      # credentials on disk either, where packaged files could reach them; the
      # release and the label use the token through the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The PR head, only as files to package. Nothing in it is run, and it gets no
      # credentials. checkout refuses a fork's code here unless told this is safe:
      # it is, as long as no later step runs anything from pr/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Take the integration and changelog from the pull request
        run: |
          # zip follows links, which could pack files from outside the integration.
          if [ -n "$(find pr/custom_components/ef_powerocean_tcpmodbus pr/CHANGELOG.md -type l)" ]; then
            echo "::error::The pull request contains symbolic links; refusing to package it."
            exit 1
          fi
          rm -rf custom_components/ef_powerocean_tcpmodbus
          cp -R pr/custom_components/ef_powerocean_tcpmodbus custom_components/
          cp pr/CHANGELOG.md CHANGELOG.md
          rm -rf pr

      - name: Prepare beta
        id: notes
        env:
          BUMP: ${{ github.event.label.name }}
        run: |
          node scripts/release.mjs beta "${BUMP#beta: }"

      - name: Package integration
        working-directory: custom_components/ef_powerocean_tcpmodbus
        run: zip -r "$RUNNER_TEMP/ef_powerocean_tcpmodbus.zip" . -x "__pycache__/*" "*/__pycache__/*"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ runner.temp }}/ef_powerocean_tcpmodbus.zip
          generate_release_notes: true
          prerelease: true

      - name: Remove label and comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
          TAG: ${{ steps.notes.outputs.tag }}
          OUTCOME: ${{ job.status }}
        run: |
          gh pr edit "$PR" --remove-label "$LABEL"
          if [ "$OUTCOME" = success ]; then
            gh pr comment "$PR" --body "Published [\`$TAG\`](https://github.com/${{ github.repository }}/releases/tag/$TAG) from ${{ github.event.pull_request.head.sha }}."
          fi
