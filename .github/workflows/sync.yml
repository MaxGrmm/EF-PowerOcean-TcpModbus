name: Auto Sync and Tag Fork (Rebase Mode)

on:
  schedule:
    - cron: '30 0 * * *' # Автоматический запуск каждый день в 00:30
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  sync_and_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # Нужно для работы fork-sync
    
    steps:
      # 1. Скачиваем ваш форк (глубина fetch-depth: 0 обязательна для rebase)
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Подключаем оригинальный репозиторий MaxGrmm для получения тегов
      - name: Fetch Upstream Tags
        run: |
          git remote add upstream https://github.com/MaxGrmm/EF-PowerOcean-TcpModbus
          git fetch upstream --tags

      # 3. Синхронизируем ветку main вашего форка с оригиналом MaxGrmm
      - name: Sync Main with Upstream
        uses: tgymnich/fork-sync@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          head: main

      # 4. Переключаемся на рабочую ветку и делаем REBASE на обновленный main
      - name: Rebase Feature Branch onto Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Получаем свежее состояние main, которое обновил предыдущий шаг
          git fetch origin main
          
          # Переходим в вашу ветку
          git checkout ef-3phase-write-to-register-battery_soc
          
          # Выполняем перебазирование поверх актуального main
          git rebase origin/main

      # 5. Находим последний тег оригинала, обновляем manifest.json и создаем ваш тег
      - name: Create Expanded Tag
        id: tag_step
        run: |
          UPSTREAM_TAG=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "")
          
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "Теги в оригинальном репозитории не найдены. Создаем базовый тег."
            NEW_TAG="v1.0.0-expanded"
          else
            NEW_TAG="${UPSTREAM_TAG}-expanded"
            echo "Найден тег оригинала: $UPSTREAM_TAG"
          fi
          
          echo "Целевой тег: $NEW_TAG"
          
          # Проверяем, существует ли уже такой тег в вашем форке harduser-gnk
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Тег $NEW_TAG уже существует. Обновляем ветку без создания нового тега."
            echo "create_release=false" >> $GITHUB_OUTPUT
            git push origin ef-3phase-write-to-register-battery_soc --force-with-lease
          else
            echo "create_release=true" >> $GITHUB_OUTPUT
            echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
            echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
            
            # --- НОВЫЙ БЛОК: Модификация manifest.json под ваш тег ---
            MANIFEST_PATH="custom_components/ef_powerocean_tcpmodbus/manifest.json"
            if [ -f "$MANIFEST_PATH" ]; then
              echo "Обновляем версию в manifest.json на $NEW_TAG"
              # Изменяем поле version в JSON-файле
              jq --arg ver "$NEW_TAG" '.version = $ver' "$MANIFEST_PATH" > tmp.json && mv tmp.json "$MANIFEST_PATH"
              
              # Коммитим измененный манифест в вашу рабочую ветку перед созданием тега
              git add "$MANIFEST_PATH"
              git commit -m "bump: update manifest.json version to $NEW_TAG [skip ci]"
            fi
            # ---------------------------------------------------------
            
            # Ставим тег на коммит с обновленным манифестом
            git tag "$NEW_TAG"
            
            # Отправляем обновленную ветку и новый тег в ваш GitHub
            git push origin ef-3phase-write-to-register-battery_soc --force-with-lease
            git push origin "$NEW_TAG"
          fi

      # 6. Получаем описание релиза из апстрима и локальные коммиты вашей ветки
      - name: Fetch Release Notes and Fork Logs
        if: steps.tag_step.outputs.create_release == 'true' && steps.tag_step.outputs.upstream_tag != ''
        id: release_info
        run: |
          # Переносим значение тега в переменную Bash
          UTAG="${{ steps.tag_step.outputs.upstream_tag }}"
          
          # Собираем домен частями, чтобы обойти текстовый фильтр
          API_HOST="api.github.com"
          API_PATH="repos/MaxGrmm/EF-PowerOcean-TcpModbus/releases/tags"
          FULL_API_URL="https://${API_HOST}/${API_PATH}/${UTAG}"
          
          echo "Запрашиваем данные оригинального релиза..."
          
          # Выполняем защищенный запрос
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$FULL_API_URL")
          ORIGINAL_BODY=$(echo "$RESPONSE" | jq -r '.body // "Описание оригинального релиза недоступно."')
          
          # Генерируем лог коммитов вашей рабочей ветки
          FORK_COMMITS=$(git log origin/main..ef-3phase-write-to-register-battery_soc --oneline)
          if [ -z "$FORK_COMMITS" ]; then
            FORK_COMMITS="Нет уникальных коммитов (ветки идентичны)."
          fi

          # Формируем итоговый файл markdown для релиза
          echo "### Изменения в оригинальном релизе ($UTAG)" > release_notes.md
          echo "[Оригинальный релиз MaxGrmm](https://github.com/MaxGrmm/EF-PowerOcean-TcpModbus/releases/tag/$UTAG)" >> release_notes.md
          echo "" >> release_notes.md
          echo "$ORIGINAL_BODY" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### Статус автоматизации форка" >> release_notes.md
          echo "- Ветка \`ef-3phase-write-to-register-battery_soc\` успешно синхронизирована." >> release_notes.md
          echo "- Выполнен \`git rebase\` поверх актуального \`main\`." >> release_notes.md
          echo "" >> release_notes.md
          echo "**Коммиты вашей рабочей ветки in этом релизе:**" >> release_notes.md
          echo "\`\`\`text" >> release_notes.md
          echo "$FORK_COMMITS" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      # 7. Фиксируем коммит как релиз с расширенным текстом (используем современный экшен)
      - name: Create GitHub Release
        if: steps.tag_step.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.new_tag }}
          name: "Release ${{ steps.tag_step.outputs.new_tag }}"
          body_path: ./release_notes.md
          draft: false
          prerelease: false
