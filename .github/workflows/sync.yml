name: Auto Sync and Tag Fork (Rebase Mode)

on:
  schedule:
    - cron: '30 0 * * *' # Автоматический запуск каждый день в 00:30
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  sync_and_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # Нужно для работы fork-sync
    
    steps:
      # 1. Скачиваем ваш форк (глубина fetch-depth: 0 обязательна для rebase)
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Подключаем оригинальный репозиторий MaxGrmm для получения тегов
      - name: Fetch Upstream Tags
        run: |
          git remote add upstream https://github.com/MaxGrmm/EF-PowerOcean-TcpModbus
          git fetch upstream --tags

      # 3. Синхронизируем ветку main вашего форка с оригиналом MaxGrmm
      - name: Sync Main with Upstream
        uses: tgymnich/fork-sync@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          head: main

      # 4. Переключаемся на рабочую ветку и делаем REBASE на обновленный main
      - name: Rebase Feature Branch onto Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Получаем свежее состояние main, которое обновил предыдущий шаг
          git fetch origin main
          
          # Переходим в вашу ветку
          git checkout ef-3phase-write-to-register-battery_soc
          
          # Выполняем перебазирование поверх актуального main
          git rebase origin/main

     # 5. Находим последний тег оригинала и создаем ваш тег с суффиксом -expanded
      - name: Create Expanded Tag
        id: tag_step
        run: |
          UPSTREAM_TAG=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "")
          
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "Теги в оригинальном репозитории не найдены. Создаем базовый тег."
            NEW_TAG="v1.0.0-expanded"
          else
            NEW_TAG="${UPSTREAM_TAG}-expanded"
            echo "Найден тег оригинала: $UPSTREAM_TAG"
          fi
          
          echo "Целевой тег: $NEW_TAG"
          
          # Проверяем, существует ли уже такой тег в вашем форке harduser-gnk
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Тег $NEW_TAG уже существует. Обновляем ветку без создания нового тега."
            echo "create_release=false" >> $GITHUB_OUTPUT
            # Отправляем перебазированную ветку (требуется force-push)
            git push origin ef-3phase-write-to-register-battery_soc --force-with-lease
          else
            echo "create_release=true" >> $GITHUB_OUTPUT
            echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
            echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
            # Ставим тег на самый свежий (перебазированный) коммит рабочей ветки
            git tag "$NEW_TAG"
            # Отправляем обновленную ветку и новый тег в ваш GitHub
            git push origin ef-3phase-write-to-register-battery_soc --force-with-lease
            git push origin "$NEW_TAG"
          fi

      # 6. Получаем описание релиза из апстрима и локальные коммиты вашей ветки
      - name: Fetch Release Notes and Fork Logs
        if: steps.tag_step.outputs.create_release == 'true' && steps.tag_step.outputs.upstream_tag != ''
        id: release_info
        run: |
          # 1. Скачиваем описание оригинального релиза из MaxGrmm через GitHub API
          UPSTREAM_TAG="${{ steps.tag_step.outputs.upstream_tag }}"
          API_URL="https://github.com/MaxGrmm/EF-PowerOcean-TcpModbus{UPSTREAM_TAG}"
          
          echo "Запрашиваем данные оригинального релиза: $API_URL"
          ORIGINAL_BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL" | jq -r '.body // "Описание оригинального релиза недоступно."')
          
          # 2. Генерируем лог ваших уникальных коммитов, которых нет в main (ваши доработки)
          FORK_COMMITS=$(git log origin/main..ef-3phase-write-to-register-battery_soc --oneline)
          if [ -z "$FORK_COMMITS" ]; then
            FORK_COMMITS="Нет уникальных коммитов (ветки идентичны)."
          fi

          # Сохраняем собранный текст в файл, чтобы обойти ограничения на многострочные переменные
          echo "### Изменения в оригинальном релизе ($UPSTREAM_TAG)" > release_notes.md
          echo "[Оригинальный релиз MaxGrmm](https://github.com/MaxGrmm/EF-PowerOcean-TcpModbus/releases/tag/${UPSTREAM_TAG})" >> release_notes.md
          echo "" >> release_notes.md
          echo "$ORIGINAL_BODY" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### Статус автоматизации форка" >> release_notes.md
          echo "- Ветка \`ef-3phase-write-to-register-battery_soc\` успешно синхронизирована." >> release_notes.md
          echo "- Выполнен \`git rebase\` поверх актуального \`main\`." >> release_notes.md
          echo "" >> release_notes.md
          echo "**Коммиты вашей рабочей ветки в этом релизе:**" >> release_notes.md
          echo "\`\`\`text" >> release_notes.md
          echo "$FORK_COMMITS" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      # 7. Фиксируем коммит как релиз с расширенным текстом
      - name: Create GitHub Release
        if: steps.tag_step.outputs.create_release == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_step.outputs.new_tag }}
          release_name: "Release ${{ steps.tag_step.outputs.new_tag }}"
          body_path: ./release_notes.md
          draft: false
          prerelease: false
