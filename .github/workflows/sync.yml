name: Auto Sync and Tag Fork (Rebase Mode)

on:
  schedule:
    - cron: '30 0 * * *' # Runs automatically every day at 00:30 UTC
  workflow_dispatch: # Button for manual trigger

jobs:
  sync_and_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # Required for fork-sync action
    
    steps:
      # 1. Checkout the fork repository with full history depth (required for rebase and tags)
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Connect the original MaxGrmm repository to fetch upstream tags
      - name: Fetch Upstream Tags
        run: |
          git remote add upstream https://github.com/MaxGrmm/EF-PowerOcean-TcpModbus
          git fetch upstream --tags

      # 3. Synchronize the main branch of your fork with MaxGrmm/main
      - name: Sync Main with Upstream
        uses: tgymnich/fork-sync@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          head: main

      # 4. Switch to your feature branch and rebase it on top of the updated main
      - name: Rebase Feature Branch onto Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch the freshly updated main branch from origin
          git fetch origin main
          
          # Switch to your feature branch
          git checkout ef-3phase-write-to-register-battery_soc
          
          # Perform rebase operation
          git rebase origin/main

      # 5. Detect the latest upstream tag, patch manifest.json, and create a custom tag
      - name: Create Expanded Tag
        id: tag_step
        run: |
          UPSTREAM_TAG=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "")
          
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "No tags found in upstream repository. Creating a fallback tag."
            NEW_TAG="v1.0.0-expanded"
          else
            NEW_TAG="${UPSTREAM_TAG}-expanded"
            echo "Found upstream tag: $UPSTREAM_TAG"
          fi
          
          echo "Target tag: $NEW_TAG"
          
          # Check if this custom tag already exists in your fork
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists. Updating the branch without recreating the tag."
            echo "create_release=false" >> $GITHUB_OUTPUT
            git push origin ef-3phase-write-to-register-battery_soc --force-with-lease
          else
            echo "create_release=true" >> $GITHUB_OUTPUT
            echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
            echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
            
            # --- Injecting new version string into manifest.json ---
            MANIFEST_PATH="custom_components/ef_powerocean_tcpmodbus/manifest.json"
            if [ -f "$MANIFEST_PATH" ]; then
              echo "Updating manifest.json version field to $NEW_TAG"

              jq --arg ver "$NEW_TAG" '.version = $ver' "$MANIFEST_PATH" > tmp.json && mv tmp.json "$MANIFEST_PATH"
              
              # Commit patched manifest directly to your feature branch before tagging
              git add "$MANIFEST_PATH"
              git commit -m "bump: update manifest.json version to $NEW_TAG [skip ci]"
            fi
            # --------------------------------------------------------
            
            # Apply tag to the latest commit with the updated manifest
            git tag "$NEW_TAG"
            
            # Push both the rebased branch and the new release tag
            git push origin ef-3phase-write-to-register-battery_soc --force-with-lease
            git push origin "$NEW_TAG"
          fi

      # 6. Fetch original release notes from upstream and compile fork changes
      - name: Fetch Release Notes and Fork Logs
        if: steps.tag_step.outputs.create_release == 'true' && steps.tag_step.outputs.upstream_tag != ''
        id: release_info
        run: |

          UTAG="${{ steps.tag_step.outputs.upstream_tag }}"
          
          # Safe step-by-step URL construction to prevent Markdown parser breakdown
          API_HOST="api.github.com"
          API_PATH="repos/MaxGrmm/EF-PowerOcean-TcpModbus/releases/tags"
          FULL_API_URL="https://${API_HOST}/${API_PATH}/${UTAG}"
          
          echo "Fetching upstream release notes..."
          
          # Execute safe cURL request to the GitHub API
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$FULL_API_URL")
          ORIGINAL_BODY=$(echo "$RESPONSE" | jq -r '.body // "Upstream release notes description is unavailable."')
          
          # Generate git log containing your unique custom commits
          FORK_COMMITS=$(git log origin/main..ef-3phase-write-to-register-battery_soc --oneline)
          if [ -z "$FORK_COMMITS" ]; then
            FORK_COMMITS="No unique custom commits found (branches are identical)."
          fi

          # Compile the markdown release notes file in English
          echo "### Upstream Release Changes ($UTAG)" > release_notes.md
          echo "[Original Release Notes by MaxGrmm](https://github.com/MaxGrmm/EF-PowerOcean-TcpModbus/releases/tag/$UTAG)" >> release_notes.md
          echo "" >> release_notes.md
          echo "$ORIGINAL_BODY" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### Fork Automation Status" >> release_notes.md
          echo "- Branch \`ef-3phase-write-to-register-battery_soc\` has been successfully synced with upstream." >> release_notes.md
          echo "- Performed automatic \`git rebase\` on top of the latest \`main\` branch." >> release_notes.md
          echo "" >> release_notes.md
          echo "**Your custom feature commits included in this release:**" >> release_notes.md
          echo "\`\`\`text" >> release_notes.md
          echo "$FORK_COMMITS" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      # 7. Publish the complete GitHub Release with compiled English changelog
      - name: Create GitHub Release
        if: steps.tag_step.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.new_tag }}
          name: "Release ${{ steps.tag_step.outputs.new_tag }}"
          body_path: ./release_notes.md
          draft: false
          prerelease: false
